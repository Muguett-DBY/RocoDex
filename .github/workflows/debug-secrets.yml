name: Debug Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Probe secret presence
        env:
          A_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          A_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          node -e "const k=Object.keys(process.env).filter(x=>x.includes('UPSTASH')||x.includes('CSTD_TELEMETRY')); console.log(JSON.stringify(k.map(x=>x+' len='+((process.env[x]||'').length))));"
