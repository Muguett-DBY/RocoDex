name: Debug Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Probe secret presence
        env:
          A_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          A_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          node -e "for (const name of ['A_URL','A_TOKEN']) console.log(name+' len='+((process.env[name]||'').length)+' prefix='+((process.env[name]||'').slice(0,8)));"
          echo "shell-side: A_URL len=\${#A_URL} A_TOKEN len=\${#A_TOKEN}"
