name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Audit locked dependencies
        run: npm run audit:dependencies

  install_policy:
    name: npm 12 install-script policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install with the project package manager
        run: |
          npm exec --yes --package=npm@12.0.2 -- npm --version
          npm exec --yes --package=npm@12.0.2 -- npm ci --strict-allow-scripts --no-audit --no-fund
      - name: Check the installed Worker runtime
        run: ./node_modules/.bin/workerd --version

  boundaries:
    name: Host and module boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify generated content
        run: npm run content:check
      - name: Verify CSTD proof and publishing contracts
        run: npm run cstd:verify-proof
      - name: Test host and import ownership
        run: npm run test:host

  quality:
    name: Static quality, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify generated content
        run: npm run content:check
      - name: Verify CSTD proof and publishing contracts
        run: npm run cstd:verify-proof
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build both sites
        run: npm run build
      - name: Report personal homepage bundle boundaries
        run: npm run verify:personal-bundle

  e2e:
    name: E2E / ${{ matrix.surface }}
    needs: [boundaries, quality, install_policy]
    runs-on: ubuntu-latest
    container:
      # Keep this version aligned with @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --shm-size=1g
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        surface: [personal, rocodex]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run isolated browser suite
        env:
          TEST_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Only test files changed: let Playwright select their affected tests.
          # Application, dependency and build changes still run the full suite.
          if git diff --quiet "$TEST_BASE" HEAD -- . ':!e2e/**' ':!.github/workflows/ci.yml'; then
            npm run test:e2e:${{ matrix.surface }} -- --only-changed="$TEST_BASE" --pass-with-no-tests
          else
            npm run test:e2e:${{ matrix.surface }}
          fi
