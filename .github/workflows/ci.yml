name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    name: Host and module boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify generated content
        run: npm run content:check
      - name: Verify CSTD proof and publishing contracts
        run: npm run cstd:verify-proof
      - name: Test host and import ownership
        run: npm run test:host

  quality:
    name: Static quality, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm run audit:dependencies
      - name: Verify generated content
        run: npm run content:check
      - name: Verify CSTD proof and publishing contracts
        run: npm run cstd:verify-proof
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Build both sites
        run: npm run build
        env:
          AUTH_SECRET: rocodex-ci-build-secret-with-sufficient-length
      - name: Verify personal homepage bundle boundaries
        run: npm run verify:personal-bundle

  e2e:
    name: E2E / ${{ matrix.surface }}
    needs: [boundaries, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        surface: [personal, rocodex]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser suite
        run: npm run test:e2e:${{ matrix.surface }}
