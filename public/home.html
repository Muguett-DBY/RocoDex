<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSTD - 实验田</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f6f1;color:#1e293b;min-height:100vh;display:flex;flex-direction:column}
  header{padding:3rem 1.5rem 1.5rem;text-align:center}
  header h1{font-size:2.5rem;font-weight:800;letter-spacing:-.5px}
  header p{margin-top:.5rem;color:#64748b}
  main{flex:1;max-width:640px;margin:0 auto;padding:2rem 1.5rem;display:grid;gap:1rem}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:1.5rem;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s;display:block}
  .card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
  .card h2{font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:.5rem}
  .card p{margin-top:.4rem;font-size:.9rem;color:#475569;line-height:1.5}
  .tag{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 10px;border-radius:20px;margin-top:.6rem;background:#ecfdf5;color:#059669}
  footer{text-align:center;padding:1.5rem;font-size:.8rem;color:#94a3b8}
</style>
</head>
<body>
<header>
  <h1>CSTD</h1>
  <p>个人项目实验田</p>
</header>
<main>
  <a class="card" href="https://rocodex.custard.top">
    <h2>洛克图鉴 / RocoDex</h2>
    <p>面向《洛克王国世界》的中文精灵图鉴，收录 347 只精灵的完整数据，支持搜索、筛选、对比、PVP 阵容查询和洛克性格测试（RKTI）。</p>
    <span class="tag">Next.js</span>
  </a>
  <div class="card" style="opacity:.5;border-style:dashed">
    <h2>更多项目 coming soon</h2>
    <p>这里将会陈列更多有趣的项目</p>
  </div>
</main>
<footer>Made with curiosity / custard.top</footer>
</body>
</html>
